<html>
  <head>
    <title>Leos Internetseite</title>
    <link rel="stylesheet" href="./Leos Internetseite.css" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="scroll-scene" id="scroll-scene">
      <div class="hero-stage">
        <img class="welcome-img" id="welcome-img" src="./img/Leo_SetUp_Illu.PNG" alt="" />

        <nav class="menu">
          <a href="./Direction.html">Location</a>
          <a href="./Menu.html">Menu</a>
          <a href="./impressum.html">Impressum</a>
          <a href="./datenschutz.html">Copyright</a>
        </nav>

        <div id="main-container">
          <h1 class="headline">Leonard Albert Zschelletzschky</h1>
          Hier findest du eine Spaßige Internetseite von Leo. <br />
          <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">
            Hier
          </a>
          kannst du ein Video von Leo sehen.
        </div>
      </div>
    </section>

    <div class="container footer">
      <div>(c) Copy the right of the Copy</div>

      <div>
        <a href="impressum.html" class="footer-link">Impressum</a>
        <a href="datenschutz.html" class="footer-link">Copyright</a>
      </div>
    </div>

    <script>
      const scene = document.querySelector("#scroll-scene");
      const image = document.querySelector("#welcome-img");
      const content = document.querySelector("#main-container");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let framePending = false;

      function updateScrollScene() {
        const sceneTop = scene.getBoundingClientRect().top;
        const scrollDistance = scene.offsetHeight - window.innerHeight;
        const progress = Math.max(0, Math.min(1, -sceneTop / scrollDistance));

        if (!reduceMotion.matches) {
          image.style.transform = `scale(${1 + progress * 0.45}) rotate(${progress * 2}deg)`;
          content.style.opacity = String(1 - progress);
          content.style.transform = `translateY(${-progress * 40}px)`;
        }

        framePending = false;
      }

      window.addEventListener("scroll", () => {
        if (!framePending) {
          window.requestAnimationFrame(updateScrollScene);
          framePending = true;
        }
      }, { passive: true });

      window.addEventListener("resize", updateScrollScene);
      updateScrollScene();
    </script>
  </body>
</html>
